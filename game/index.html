<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Code Baymax</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { display: grid; place-items: center; }
    #content { width: 100%; height: 100%; display: grid; place-items: center; }
    canvas { max-width: 100% !important; max-height: 100% !important; width: auto !important; height: auto !important; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script>
    (() => {
      const originalSetItem = Storage.prototype.setItem;
      Storage.prototype.setItem = function (key, value) {
        originalSetItem.call(this, key, value);
        if (typeof key === "string" && key.startsWith("flambe:level")) {
          try { parent.postMessage({ type: "code-baymax-progress", key }, location.origin); } catch (_) {}
        }
      };
    })();
  </script>
  <script src="flambe.js"></script>
  <script>
    flambe.embed(["targets/main-html.js", "targets/main-flash.swf"], "content");
    try { parent.postMessage({ type: "code-baymax-ready" }, location.origin); } catch (_) {}
  </script>
</body>
</html>
